name: Bug report
description: Something in the framework behaves differently from what its rules or docs state.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        For a **security vulnerability**, do not open an issue — follow `SECURITY.md` instead.

        Vendored `-3rd` skills are third-party content (see `NOTICE.md`); issues in their
        *content* usually belong upstream, not here. Issues in how this framework *loads*
        or *routes* them do belong here.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what actually occurred.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The exact commands or the slash command / workflow phase where it appeared.
      placeholder: |
        1. Installed via `.agents/scripts/install.sh`
        2. Ran `/agents:start`
        3. ...
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Which mode
      options:
        - Host project (installed as a git submodule)
        - Nucleus (working inside this repo itself)
        - Not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The tag you pinned, or the commit SHA if you track `main`.
      placeholder: v4.2.1
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS and `python3 --version` (the framework requires 3.10+).
    validations:
      required: false
