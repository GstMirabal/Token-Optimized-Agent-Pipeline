name: Framework Self-Governance CI

on:
  push:
    branches: [main, "ai-sprint/**"]
  pull_request:
    branches: [main]

# CI invokes `make verify` rather than restating its steps. Before Phase 019 the
# two sides had drifted in BOTH directions: CI ran pytest, verify_references,
# manifest parity and the RA-15 path scan that `make verify` did not, while
# `make verify` ran the workflow-determinism scan that CI did not. A green local
# run predicted nothing about CI, and vice versa. Keeping the list in one place
# makes that divergence impossible rather than something to police.
#
# Only steps that cannot be a command belong here: the Vale prose lint is a
# GitHub Action. Anything needing network or credentials stays out of `verify`.

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install -q pytest

      - name: Framework self-check (make verify)
        run: make verify

      - name: Diátaxis prose lint (Blueprints only — rules/documentation_standard.md §1)
        uses: errata-ai/vale-action@v2
        with:
          files: '["**/*_BLUEPRINT.md"]'
          fail_on_error: false
