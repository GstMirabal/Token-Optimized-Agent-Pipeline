# Configuration file for Agents rule optimization under SkillOpt.

# Actual model routing is controlled by the flat `model_backend` key below,
# read directly by train_runner.py's apply_monkeypatches(). Default (unset,
# or any value without "claude") -> Gemini via gemini_backend.py. Set to
# "claude" to route through the Claude Agent SDK instead.
model_backend: gemini

model:
  # NOT a live backend selector — this names the vendor module
  # (skillopt.model.azure_openai) that apply_monkeypatches() imports and
  # patches in place, per SKILL.md's "runtime monkeypatching without
  # mutating PyPI package binaries." Leave as azure_openai regardless of
  # model_backend above; renaming it breaks the import.
  backend: azure_openai
  optimizer: gemini-flash-latest
  target: gemini-flash-latest

train:
  num_epochs: 1
  train_size: 2
  batch_size: 2
  seed: 42
  accumulation: 1

gradient:
  minibatch_size: 2
  analyst_workers: 4
  failure_only: true
  merge_batch_size: 2

optimizer:
  learning_rate: 2
  min_learning_rate: 1
  lr_scheduler: constant
  skill_update_mode: patch
  use_slow_update: false
  use_meta_skill: false

evaluation:
  use_gate: true
  sel_env_num: 1
  test_env_num: 1
  eval_test: true

env:
  name: agents_opt
  skill_init: .agents/agents.md
  data_path: .agents/skills/skillopt/data/scenarios.json
  split_mode: ratio
  split_ratio: "2:1:7"
  split_seed: 42
  out_root: outputs/agents_opt
